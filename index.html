<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #111111;
    font-family: "Courier PS", "Courier New", Courier, monospace;
  }

  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-decoration-color: #f3b8ff; }

  .stage-wrapper {
    width: 100%;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 1456px;
    height: 820px;
    transform-origin: top left;
  }

  .identity {
    position: absolute;
    left: 80px;
    top: 64px;
  }

  .name {
    font-family: 'Cooper Hewitt', 'Archivo', sans-serif;
    font-weight: 300;
    font-size: 59px;
    letter-spacing: 0.5px;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tagline {
    margin-top: 5px;
    font-size: 19px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .roles {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .role-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    font-size: 18px;
  }

  .role-row dt {
    color: #8a8a8a;
    letter-spacing: 1px;
  }

  .role-row dd {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 17.5px;
  }

  .astro-block {
    position: absolute;
    right: 84px;
    top: 64px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 18px;
    text-align: right;
  }

  .astro-symbols {
    font-size: 18px;
    letter-spacing: 3px;
  }

  .nav-links {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    margin-top: 21px;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .image-wrap {
    position: absolute;
    left: 405px;
    top: 239px;
    width: 777px;
  }

  .image-wrap img,
  .image-placeholder {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .image-placeholder {
    height: 340px;
    border: 1px dashed #cfcfcf;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b3b3b3;
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
    padding: 20px;
  }

  .lower {
    position: absolute;
    left: 80px;
    top: 478px;
    width: 380px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .label {
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8a8a8a;
    margin-bottom: 8px;
  }

  .value {
    font-family: 'Inter', sans-serif;
    font-size: 17.5px;
    line-height: 1.2;
    white-space: nowrap;
    overflow-wrap: break-word;
    font-variant-numeric: tabular-nums;
  }

  .mobile-break {
    display: none;
  }

  .social {
    position: absolute;
    right: 84px;
    top: 655px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stage.mobile {
    width: 100%;
    height: auto;
    transform: none;
    padding: 32px 24px;
  }

  .stage.mobile .identity,
  .stage.mobile .astro-block,
  .stage.mobile .image-wrap,
  .stage.mobile .lower,
  .stage.mobile .social {
    position: static;
    width: 100%;
    left: auto;
    right: auto;
    top: auto;
    margin-bottom: 32px;
    font-size: 14px;
  }

  .stage.mobile .image-wrap {
    max-width:365px;
  }

  .stage.mobile .astro-block,
  .stage.mobile .nav-links,
  .stage.mobile .social {
    align-items: flex-start;
    text-align: left;
    font-size: 14px;
  }

  .stage.mobile .astro-block {
    margin-top: -15px;
    gap: 8px;
  }

  .stage.mobile .image-wrap img {
    max-width: 420px;
  }

  .stage.mobile .name {
    font-size: 34px;
    white-space: normal;
  }

  .stage.mobile .tagline,
  .stage.mobile .value,
  .stage.mobile .label, 
  .stage.mobile .astro-symbols, 
  .stage.mobile .roles, 
  .stage.mobile .role-row dd, 
  .stage.mobile .role-row dt {
    font-size: 14px;
}

  .stage.mobile .value {
    white-space: normal;
  }

  .stage.mobile .mobile-break {
    display: inline;
  }

</style>

<script>

  (function () {
    var DESIGN_WIDTH = 1456;
    var DESIGN_HEIGHT = 820;
    var MOBILE_BREAKPOINT = 700;

    var wrapper = document.getElementById('stageWrapper');
    var stage = document.getElementById('stage');

    function applyScale() {
      var vw = window.innerWidth;

      if (vw < MOBILE_BREAKPOINT) {
        stage.classList.add('mobile');
        stage.style.transform = 'none';
        stage.style.width = '';
        stage.style.height = '';
        wrapper.style.height = 'auto';
        return;
      }

      stage.classList.remove('mobile');

      var scale = Math.min(1, vw / DESIGN_WIDTH);

      stage.style.width = DESIGN_WIDTH + 'px';
      stage.style.height = DESIGN_HEIGHT + 'px';
      stage.style.transform = 'scale(' + scale + ')';

      wrapper.style.height = (DESIGN_HEIGHT * scale) + 'px';
    }

    window.addEventListener('resize', applyScale);
    window.addEventListener('load', applyScale);
    applyScale();
  })();
</script>

<script>

  (function () {
    var timeEl = document.getElementById('time-value');
    var moonEl = document.getElementById('moon-value');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateClock() {
      var now = new Date();
      var hh = pad(now.getUTCHours());
      var mm = pad(now.getUTCMinutes());
      var ss = pad(now.getUTCSeconds());
      var month = pad(now.getUTCMonth() + 1);
      var day = pad(now.getUTCDate());
      var year = now.getUTCFullYear();
      timeEl.innerHTML = hh + ':' + mm + ':' + ss + ' UTC<br>' + month + '/' + day + '/' + year;
    }

    function getMoonPhase(date) {
      var synodicMonth = 29.530588853;
      var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0); 
      var daysSince = (date.getTime() - knownNewMoon) / 86400000;
      var phase = daysSince % synodicMonth;
      if (phase < 0) phase += synodicMonth;

      var phaseNames = [
        'New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous',
        'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'
      ];
      var index = Math.floor((phase / synodicMonth) * 8 + 0.5) % 8;
      return phaseNames[index];
    }

    updateClock();
    setInterval(updateClock, 1000);
    moonEl.textContent = getMoonPhase(new Date());
  })();
</script>

<script>

  (function () {
    var showValueEl = document.getElementById('show-value');

    var today = new Date();
    var mm = String(today.getUTCMonth() + 1).padStart(2, '0');
    var dd = String(today.getUTCDate()).padStart(2, '0');

    var callbackName = '__gdShowCallback_' + Date.now();

    window[callbackName] = function (data) {
      cleanup();

      var docs = (data && data.response && data.response.docs) || [];

      docs = docs.filter(function (d) {

        return d.date && d.identifier && d.venue;
      });

      if (docs.length === 0) {
        showValueEl.textContent = 'Hippies touched grass and danced.';
        return;
      }

      var byDate = {};
      docs.forEach(function (d) {
        (byDate[d.date] = byDate[d.date] || []).push(d);
      });
      var dates = Object.keys(byDate);
      var chosenDate = dates[Math.floor(Math.random() * dates.length)];
      var candidates = byDate[chosenDate];

      var show = pickBestRecording(candidates);
      renderShow(show);
    };

    function sourceRank(identifier) {
      var id = identifier.toLowerCase();
      if (/\bsbd\b/.test(id)) return 4;
      if (/\bmtx\b|matrix/.test(id)) return 3;
      if (/\bfm\b/.test(id)) return 2;
      if (/\baud\b/.test(id)) return 1;
      return 0; 
    }

    function pickBestRecording(candidates) {
      return candidates.slice().sort(function (a, b) {
        var rankDiff = sourceRank(b.identifier) - sourceRank(a.identifier);
        if (rankDiff !== 0) return rankDiff;

        var ratingDiff = (b.avg_rating || 0) - (a.avg_rating || 0);
        if (ratingDiff !== 0) return ratingDiff;

        return (b.downloads || 0) - (a.downloads || 0);
      })[0];
    }

    function renderShow(show) {
      var year = show.date.slice(0, 4);
      var dateStr = mm + '/' + dd + '/' + year;

      var venue = show.venue;
      var cityState = show.coverage || '';
      var archiveUrl = 'https://archive.org/details/' + encodeURIComponent(show.identifier);

      var inner = dateStr + ' &ndash; ' + escapeHtml(venue);
      if (cityState) {
        inner += ',<br class="mobile-break"> ' + escapeHtml(cityState);
      }
      showValueEl.innerHTML = '<a href="' + archiveUrl
        + '" target="_blank" rel="noopener">' + inner + '</a>';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeoutId);
    }

    var timeoutId = setTimeout(function () {
      showValueEl.textContent = "Hippies touched grass and danced.";
      cleanup();
    }, 8000);

    var query = '(identifier:gd????-' + mm + '-' + dd + '*'
      + ' OR identifier:jgb????-' + mm + '-' + dd + '*'
      + ' OR identifier:jg??-' + mm + '-' + dd + '*)';
    var url = 'https://archive.org/advancedsearch.php'
      + '?q=' + encodeURIComponent(query)
      + '&fl[]=identifier&fl[]=date&fl[]=venue&fl[]=coverage&fl[]=title&fl[]=avg_rating&fl[]=downloads'
      + '&rows=300&output=json&callback=' + callbackName;

    var script = document.createElement('script');
    script.src = url;
    script.onerror = function () {
      showValueEl.textContent = "Hippies touched grass and danced.";
      cleanup();
    };
    document.body.appendChild(script);
  })();
</script>
